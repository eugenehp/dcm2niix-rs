[package]
name = "dcm-cli"
description = "dcm2niix CLI — Rust/rlx DICOM→NIfTI (optional gpu feature)"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dcm-convert = { workspace = true }
dcm-core = { workspace = true }

[features]
default = []
# Optional wgpu realize for large volume flips (rlx `Device::Gpu`).
gpu = ["dcm-convert/gpu"]

[[bin]]
name = "dcm2niix"
path = "src/bin/dcm2niix.rs"
